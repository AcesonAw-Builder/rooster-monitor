function timeToMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function isOnCall(clinician, timeHHMM) {
  const t = timeToMinutes(timeHHMM);
  const start = timeToMinutes(clinician.onCallStart);
  const end = timeToMinutes(clinician.onCallEnd);
  return t >= start && t <= end;
}

function minutesToHandover(clinician, timeHHMM) {
  const t = timeToMinutes(timeHHMM);
  const end = timeToMinutes(clinician.onCallEnd);
  return end - t;
}

function genId(prefix, n) {
  return `${prefix}-${String(n).padStart(6, '0')}`;
}

function randomFrom(arr) {

}

function minutesAgo(m) {
  const d = new Date();
  d.setMinutes(d.getMinutes() - m);

}

function relativeTime(date) {
  if (!date) return '—';
  const diffMs = Date.now() - date.getTime();
  const diffSec = Math.floor(diffMs / 1000);
  if (diffSec < 60) return `${diffSec}s ago`;
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.floor(diffMin / 60);
  return `${diffHr}h ${diffMin % 60}m ago`;
}

function formatTime(date) {
  if (!date) return '—';
  return date.toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

function StatusBadge({ status }) {
  const m = STATUS_META[status] || STATUS_META.active;
  return (
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-xs font-mono font-semibold border ${m.bg} ${m.text} ${m.border}`}>
      <span className={`w-1.5 h-1.5 rounded-full ${m.dot} ${status === 'active' || status === 'escalated' ? 'pulse-dot' : ''}`} />
      {m.label}
    </span>
  );
}

function PriorityBadge({ priority }) {
  const m = PRIORITY_META[priority] || PRIORITY_META.routine;
  return (
    <span className={`inline-flex items-center px-1.5 py-0.5 rounded text-xs font-mono font-bold border ${m.bg} ${m.text} ${m.border}`}>
      {m.label}
    </span>
  );
}

function EscalationDots({ level, max }) {
  return (
    <div className="flex items-center gap-1">
      {Array.from({ length: max }).map((_, i) => (
        <span
          key={i}
          className={`w-2 h-2 rounded-full ${i < level ? 'bg-orange-400' : 'bg-surface-600'}`}
          title={`Escalation level ${i + 1}`}
        />
      ))}
      <span className="text-xs text-slate-500 font-mono ml-1">{level}/{max}</span>
    </div>
  );
}

function SmsIndicator({ delivered, failed }) {
  if (failed) return (
    <span className="inline-flex items-center gap-1 text-xs text-red-400 font-mono">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4.5" stroke="currentColor"/><path d="M3 3l4 4M7 3l-4 4" stroke="currentColor" strokeWidth="1.2"/></svg>
      FAIL
    </span>
  );
  if (delivered) return (
    <span className="inline-flex items-center gap-1 text-xs text-green-400 font-mono">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5.5l2.5 2.5 4.5-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      SENT
    </span>
  );
  return <span className="text-xs text-slate-500 font-mono">—</span>;
}

function Ticker({ alerts }) {
  const criticalUnacked = alerts.filter(a => a.priority === 'critical' && !a.acknowledgedAt);
  if (criticalUnacked.length === 0) return null;
  return (

// ─── ROUTE SIMULATOR ─────────────────────────────────────────────────────────

function RouteSimulator() {
  const now = new Date();
  const currentHHMM = now.toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', hour12: false });

  const [simHospital, setSimHospital]         = React.useState('SGH');
  const [simSpecialty, setSimSpecialty]       = React.useState('Haematology');
  const [simResultType, setSimResultType]     = React.useState('Critical Result');
  const [simTime, setSimTime]                 = React.useState(currentHHMM);
  const [simResult, setSimResult]             = React.useState(null);

  const hospitals   = ['SGH', 'TTSH', 'NUH', 'CGH', 'KKH'];
  const resultTypes = ['Critical Result', 'Unexpected Result'];

  function runSimulation() {
    const key = `${simHospital}:${simSpecialty}`;
    const rule = ROUTING_RULES[key];
    if (!rule) {
      setSimResult({ error: true, key });
      return;
    }
    const chain = rule.chain;
    const activeIndex = isOnCall(chain[0], simTime) ? 0 : 1;
    const handoverMins = minutesToHandover(chain[activeIndex], simTime);
    const handoverWarning = handoverMins >= 0 && handoverMins <= 30;
    setSimResult({ rule, chain, activeIndex, handoverWarning, handoverMins, key });
  }

  const selectBase = 'w-full bg-surface-700 border border-surface-600 rounded px-3 py-2 text-xs font-mono text-slate-200 outline-none focus:border-accent-blue cursor-pointer';
  const labelCls   = 'text-xs font-mono text-slate-500 uppercase tracking-widest mb-1 block';

  return (
    <div className="flex-1 overflow-auto px-4 py-4">

      {/* Panel header */}
      <div className="mb-4">
        <div className="text-sm font-semibold text-white">Routing Verification</div>
        <div className="text-xs text-slate-500 font-mono mt-0.5">
          Verify who receives an alert before it is sent — simulates Rooster routing rules for the selected hospital, specialty, and time.
        </div>
      </div>

      <div className="flex flex-col lg:flex-row gap-4 items-start">

        {/* ── LEFT: Input form ── */}
        <div className="w-full lg:w-72 lg:shrink-0 bg-surface-800 border border-surface-600 rounded p-4 flex flex-col gap-4">
          <div className="text-xs font-mono text-slate-400 uppercase tracking-widest border-b border-surface-600 pb-2">
            Simulation inputs
          </div>

          <div>
            <label className={labelCls}>Hospital</label>
            <select value={simHospital} onChange={e => setSimHospital(e.target.value)} className={selectBase}>
              {hospitals.map(h => <option key={h} value={h}>{h}</option>)}
            </select>
          </div>

          <div>
            <label className={labelCls}>Specialty</label>
            <select value={simSpecialty} onChange={e => setSimSpecialty(e.target.value)} className={selectBase}>
              {SPECIALTIES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>

          <div>
            <label className={labelCls}>Result type</label>
            <div className="flex gap-2">
              {resultTypes.map(rt => (
                <button
                  key={rt}
                  onClick={() => setSimResultType(rt)}
                  className={`flex-1 px-2 py-2 text-xs font-mono rounded border transition-colors cursor-pointer ${
                    simResultType === rt
                      ? rt === 'Critical Result'
                        ? 'bg-red-500/20 border-red-500/50 text-red-300'
                        : 'bg-orange-500/20 border-orange-500/50 text-orange-300'
                      : 'bg-transparent border-surface-600 text-slate-400 hover:border-surface-400'
                  }`}>
                  {rt}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className={labelCls}>Simulated time</label>
            <input
              type="time"
              value={simTime}
              onChange={e => setSimTime(e.target.value)}
              className={selectBase}
            />
            <div className="text-xs text-slate-600 font-mono mt-1">Current: {currentHHMM}</div>
          </div>

          <button
            onClick={runSimulation}
            className="w-full py-2.5 text-xs font-mono font-bold bg-accent-blue/15 border border-accent-blue/40 text-accent-blue rounded hover:bg-accent-blue/25 transition-colors cursor-pointer uppercase tracking-wider"
          >
            Run simulation →
          </button>
        </div>

        {/* ── RIGHT: Output ── */}
        <div className="w-full lg:flex-1 lg:min-w-0">
          {!simResult ? (
            <div className="bg-surface-800 border border-surface-600 border-dashed rounded p-8 flex flex-col items-center justify-center gap-2 text-center">
              <div className="w-8 h-8 rounded bg-surface-700 border border-surface-600 flex items-center justify-center">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M8 1v6M8 9v6M1 8h6M9 8h6" stroke="#4d5562" strokeWidth="1.5" strokeLinecap="round"/>
                </svg>
              </div>
              <div className="text-xs text-slate-600 font-mono">Configure inputs and run simulation to see routing chain</div>
            </div>
          ) : simResult.error ? (
            <div className="bg-red-500/10 border border-red-500/30 rounded p-4">
              <div className="text-xs font-mono font-bold text-red-400 mb-1">NO ROUTING RULE FOUND</div>
              <div className="text-xs text-slate-400 font-mono">
                No on-call configuration exists for <span className="text-white">{simResult.key}</span>.
                This specialty is unmapped at this hospital — a result arriving now would have no recipient.
              </div>
              <div className="mt-3 text-xs text-slate-500 font-mono border-t border-red-500/20 pt-3">
                Action required: hospital admin must configure this specialty routing before alerts can be delivered.
              </div>
            </div>
          ) : (
            <div className="flex flex-col gap-3">

              {/* Summary card */}
              <div className={`rounded p-3 border text-xs font-mono ${
                simResultType === 'Critical Result'
                  ? 'bg-red-500/10 border-red-500/30 text-red-300'
                  : 'bg-orange-500/10 border-orange-500/30 text-orange-300'
              }`}>
                <span className="font-bold">{simResultType === 'Critical Result' ? 'CRITICAL' : 'UNEXPECTED'}</span>
                {' '}result · <span className="text-white">{simSpecialty}</span> · <span className="text-white">{simHospital}</span> · arriving at <span className="text-white">{simTime}</span>
              </div>

              {/* Handover warning */}
              {simResult.handoverWarning && (
                <div className="bg-orange-500/10 border border-orange-500/40 rounded p-3 flex items-start gap-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-orange-400 pulse-dot mt-1 shrink-0" />
                  <div className="text-xs font-mono text-orange-300">
                    <span className="font-bold">On-call handover in {simResult.handoverMins} min</span> — verify coverage continuity before sending.
                    The primary clinician's shift ends at {simResult.chain[simResult.activeIndex].onCallEnd}.
                  </div>
                </div>
              )}

              {/* Routing chain */}
              <div className="bg-surface-800 border border-surface-600 rounded overflow-hidden">
                <div className="px-4 py-2.5 border-b border-surface-600 bg-surface-750 text-xs font-mono text-slate-400 uppercase tracking-widest">
                  Escalation chain — {simHospital} {simSpecialty}
                </div>
                <div className="p-4 relative">
                  <div className="absolute left-6 top-8 bottom-8 w-px bg-surface-600" />
                  {simResult.chain.map((clinician, i) => {
                    const isActive = i === simResult.activeIndex;
                    const onCall   = isOnCall(clinician, simTime);
                    const minsLeft = minutesToHandover(clinician, simTime);
                    return (
                      <div key={i} className={`flex items-start gap-4 mb-5 last:mb-0 relative`}>
                        {/* Level dot */}
                        <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 z-10 ${
                          isActive
                            ? 'border-accent-blue bg-accent-blue/30'
                            : 'border-surface-500 bg-surface-800'
                        }`}>
                          {isActive && <span className="w-1.5 h-1.5 rounded-full bg-accent-blue pulse-dot" />}
                        </div>

                        {/* Content */}
                        <div className={`flex-1 bg-surface-700 rounded p-3 border ${
                          isActive ? 'border-accent-blue/40' : 'border-surface-600'
                        }`}>
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <div className={`text-xs font-semibold ${isActive ? 'text-white' : 'text-slate-400'}`}>
                                {clinician.name}
                              </div>
                              <div className="text-xs text-slate-500 font-mono mt-0.5">
                                {clinician.role} · {clinician.phone}
                              </div>
                            </div>
                            <div className="flex flex-col items-end gap-1 shrink-0">
                              {isActive && (
                                <span className="px-1.5 py-0.5 bg-accent-blue/15 border border-accent-blue/40 rounded text-xs font-mono font-bold text-accent-blue">
                                  PAGED FIRST
                                </span>
                              )}
                              {!isActive && i > 0 && (
                                <span className="text-xs font-mono text-slate-500">
                                  +{i * 10} min
                                </span>
                              )}
                            </div>
                          </div>

                          <div className="flex items-center gap-3 mt-2 text-xs font-mono text-slate-500">
                            <span className={`flex items-center gap-1 ${onCall ? 'text-green-400' : 'text-slate-600'}`}>
                              <span className={`w-1.5 h-1.5 rounded-full ${onCall ? 'bg-green-400' : 'bg-surface-600'}`} />
                              On-call {clinician.onCallStart}–{clinician.onCallEnd}
                            </span>
                            {isActive && onCall && minsLeft > 0 && minsLeft <= 60 && (
                              <span className="text-orange-400">{minsLeft}min to handover</span>
                            )}
                          </div>

                          {i > 0 && (
                            <div className="mt-2 text-xs text-slate-600 font-mono border-t border-surface-600 pt-2">
                              {i === 1 ? 'Escalates if no ack after 10 min' : 'Final escalation — no further chain'}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Coverage footer */}
                <div className="px-4 py-2.5 border-t border-surface-600 bg-surface-750 flex items-center justify-between">
                  <span className="text-xs font-mono text-slate-500">
                    3-level chain · auto-escalation every 10 min
                  </span>
                  <span className="flex items-center gap-1.5 text-xs font-mono text-green-400">
                    <span className="w-1.5 h-1.5 rounded-full bg-green-400" />
                    Coverage confirmed
                  </span>
                </div>
              </div>

            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────

function App() {
  const [activeTab, setActiveTab] = useState('monitor');
  const [alerts, setAlerts] = useState(INITIAL_ALERTS);
  const [now, setNow] = useState(new Date());
  const [selectedId, setSelectedId] = useState('ALT-2026-000391');
  const [filterHospital, setFilterHospital] = useState('All');
  const [filterStatus, setFilterStatus] = useState('All');
  const [filterPriority, setFilterPriority] = useState('All');
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState('time');

  // Tick clock every second
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  // Filter + sort
  const filtered = alerts
    .filter(a => {
      if (filterHospital !== 'All' && a.hospital !== filterHospital) return false;
      if (filterStatus !== 'All' && a.status !== filterStatus) return false;
      if (filterPriority !== 'All' && a.priority !== filterPriority) return false;
      if (search) {
        const q = search.toLowerCase();
        return (
          a.id.toLowerCase().includes(q) ||
          a.patientId.toLowerCase().includes(q) ||
          a.mrn.includes(q) ||
          a.ward.toLowerCase().includes(q) ||
          a.alertType.toLowerCase().includes(q) ||
          (a.assignedTo && a.assignedTo.name.toLowerCase().includes(q))
        );
      }
      return true;
    })
    .sort((a, b) => {
      if (sort === 'time') return b.routedAt - a.routedAt;
      if (sort === 'priority') {
        const p = { critical: 0, urgent: 1, routine: 2 };
        return (p[a.priority] ?? 9) - (p[b.priority] ?? 9);
      }
      if (sort === 'status') {
        const s = { 'no-coverage': 0, escalated: 1, active: 2, resolved: 3 };
        return (s[a.status] ?? 9) - (s[b.status] ?? 9);
      }
      if (sort === 'hospital') return a.hospital.localeCompare(b.hospital);
      return 0;
    });

  // Stats
  const activeCount    = alerts.filter(a => a.status === 'active').length;
  const escalatedCount = alerts.filter(a => a.status === 'escalated').length;
  const noCoverCount   = alerts.filter(a => a.status === 'no-coverage').length;
  const resolvedToday  = alerts.filter(a => a.status === 'resolved').length;
  const responseTimes  = alerts.filter(a => a.responseTime !== null).map(a => a.responseTime);
  const avgResponse    = responseTimes.length
    ? (responseTimes.reduce((s, v) => s + v, 0) / responseTimes.length).toFixed(1)
    : '—';
  const criticalUnacked = alerts.filter(a => a.priority === 'critical' && !a.acknowledgedAt).length;

  const selectedAlert = alerts.find(a => a.id === selectedId);

  const currentTime = now.toLocaleTimeString('en-SG', {
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  });
  const currentDate = now.toLocaleDateString('en-SG', {
    weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
  });

  return (
    <div className="min-h-screen bg-surface-900 text-slate-200 flex flex-col">

      {/* ── HEADER ── */}
      <header className="bg-surface-800 border-b border-surface-600 px-4 py-2.5 flex items-center justify-between shrink-0 gap-2">
        <div className="flex items-center gap-2 sm:gap-4 min-w-0">
          <div className="flex items-center gap-2.5 shrink-0">
            <div className="w-7 h-7 rounded bg-blue-500/20 border border-blue-500/40 flex items-center justify-center">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 1v4M7 9v4M1 7h4M9 7h4" stroke="#58a6ff" strokeWidth="1.5" strokeLinecap="round"/>
                <circle cx="7" cy="7" r="2" fill="#58a6ff" fillOpacity=".3" stroke="#58a6ff" strokeWidth="1"/>
              </svg>
            </div>
            <div>
              <div className="text-sm font-semibold text-white leading-none">Rooster</div>
              <div className="text-xs text-slate-500 leading-none mt-0.5">Clinical Alert Monitor</div>
            </div>
          </div>
          <div className="hidden sm:block w-px h-8 bg-surface-600 shrink-0" />
          <div className="hidden sm:block text-xs text-slate-400 font-mono truncate">All Hospitals · SingHealth Cluster</div>
        </div>

        <div className="flex items-center gap-2 sm:gap-3 shrink-0">
          {/* Tab toggle */}
          <div className="flex items-center bg-surface-700 border border-surface-600 rounded overflow-hidden">
            {[['monitor', 'Monitor'], ['simulator', 'Simulator']].map(([tab, label]) => (
              <button
                key={tab}
                onClick={() => setActiveTab(tab)}
                className={`px-2 sm:px-3 py-1.5 text-xs font-mono transition-colors cursor-pointer border-none ${
                  activeTab === tab
                    ? tab === 'simulator'
                      ? 'bg-accent-blue/20 text-accent-blue'
                      : 'bg-surface-600 text-white'
                    : 'bg-transparent text-slate-500 hover:text-slate-300'
                }`}
              >
                {label}
              </button>
            ))}
          </div>

          {criticalUnacked > 0 && activeTab === 'monitor' && (
            <div className="flex items-center gap-1.5 bg-red-500/15 border border-red-500/40 rounded px-2 sm:px-3 py-1.5">
              <span className="w-2 h-2 rounded-full bg-red-400 pulse-dot shrink-0" />
              <span className="text-xs font-mono font-bold text-red-300 hidden xs:inline">{criticalUnacked} CRITICAL</span>
              <span className="text-xs font-mono font-bold text-red-300 xs:hidden">{criticalUnacked}!</span>
            </div>
          )}
          <div className="hidden md:block text-right">
            <div className="text-sm font-mono text-white">{currentTime}</div>
            <div className="text-xs text-slate-500">{currentDate}</div>
          </div>
          <div className="hidden md:block w-px h-8 bg-surface-600" />
          <div className="flex items-center gap-2">
            <div className="w-6 h-6 rounded-full bg-teal-500/30 border border-teal-500/50 flex items-center justify-center text-xs font-bold text-teal-300 shrink-0">
              TL
            </div>
            <div className="hidden sm:block">
              <div className="text-xs font-semibold text-slate-200">Tan Li Ling</div>
              <div className="text-xs text-slate-500">Coordinator · SGH</div>
            </div>
          </div>
          <div className="w-2 h-2 rounded-full bg-green-400 shrink-0" title="System online" />
        </div>
      </header>

      {/* ── TICKER (monitor only) ── */}
      {activeTab === 'monitor' && <Ticker alerts={alerts} />}

      {/* ── ROUTE SIMULATOR VIEW ── */}
      {activeTab === 'simulator' && <RouteSimulator />}

      {/* ── MONITOR VIEW ── */}
      {activeTab === 'monitor' && <>

      {/* ── STATS BAR ── */}
      <div className="px-4 pt-3 pb-2 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 shrink-0">
        <StatCard
          label="Active Alerts"
          value={activeCount}
          sub="Awaiting acknowledgment"
          color="text-blue-400"
        />
        <StatCard
          label="Escalated"
          value={escalatedCount}
          sub="Past response threshold"
          color="text-orange-400"
          flash={escalatedCount > 0}
        />
        <StatCard
          label="No Coverage"
          value={noCoverCount}
          sub="No available clinician"
          color="text-red-400"
          flash={noCoverCount > 0}
        />
        <StatCard
          label="Resolved Today"
          value={resolvedToday}
          sub="Within current shift"
          color="text-green-400"
        />
        <StatCard
          label="Avg Response"
          value={`${avgResponse}m`}
          sub="Across resolved alerts"
          color={parseFloat(avgResponse) <= 7.5 ? 'text-green-400' : 'text-orange-400'}
        />
        <StatCard
          label="Total Alerts"
          value={alerts.length}
          sub={`${filtered.length} in view`}
          color="text-slate-300"
        />
      </div>

      {/* ── FILTER BAR ── */}
      <div className="px-4 pb-2 shrink-0">
        <FilterBar
          hospital={filterHospital} setHospital={setFilterHospital}
          status={filterStatus} setStatus={setFilterStatus}
          priority={filterPriority} setPriority={setFilterPriority}
          search={search} setSearch={setSearch}
          sort={sort} setSort={setSort}
        />
      </div>

      {/* ── MAIN CONTENT (table + detail panel) ── */}
      <div className="flex flex-col lg:flex-row gap-2 px-4 pb-4 lg:flex-1 lg:overflow-hidden lg:min-h-0">

        {/* Table */}
        <div className="min-h-[400px] lg:min-h-0 lg:flex-1 bg-surface-800 border border-surface-600 rounded overflow-hidden flex flex-col min-w-0">
          {/* Table header */}
          <div className="flex items-center justify-between px-3 py-2 border-b border-surface-600 bg-surface-750 shrink-0">
            <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">
              Alert Queue — {filtered.length} record{filtered.length !== 1 ? 's' : ''}
            </span>
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-600 font-mono">Last refresh: {currentTime}</span>
              <span className="w-1.5 h-1.5 rounded-full bg-green-400 pulse-dot" />
            </div>
          </div>

          {/* Scrollable table */}
          <div className="overflow-auto flex-1">
            <table className="w-full text-left border-collapse">
              <thead className="sticky top-0 bg-surface-750 z-10">
                <tr className="border-b border-surface-600">
                  {[
                    'Alert ID',
                    'Status',
                    'Type / Finding',
                    'Hospital / Location',
                    'Patient',
                    'Assigned Clinician',
                    'Escalation',
                    'SMS',
                    'Resp. Time',
                    'Routed / Acked',
                  ].map(h => (
                    <th key={h} className="px-3 py-2 text-xs font-mono font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr>
                    <td colSpan={10} className="px-4 py-8 text-center text-slate-600 text-sm font-mono">
                      No alerts match current filters
                    </td>
                  </tr>
                ) : (
                  filtered.map(alert => (
                    <AlertRow
                      key={alert.id}
                      alert={alert}
                      selected={selectedId === alert.id}
                      onSelect={setSelectedId}
                    />
                  ))
                )}
              </tbody>
            </table>
          </div>

          {/* Footer */}
          <div className="px-3 py-2 border-t border-surface-600 bg-surface-750 shrink-0 flex items-center justify-between">
            <div className="flex items-center gap-4 text-xs font-mono text-slate-500">
              <span>
                <span className="w-2 h-2 rounded-full bg-red-400 inline-block mr-1" />
                Critical rows flash until acknowledged
              </span>
              <span>Click row to inspect</span>
            </div>
            <div className="flex items-center gap-3 text-xs font-mono text-slate-600">
              <span>SMS escalation: auto after <span className="text-slate-400">10 min</span></span>
              <span>Max escalation depth: <span className="text-slate-400">3</span></span>
            </div>
          </div>
        </div>

        {/* Detail panel */}
        <div className="w-full lg:w-80 shrink-0">
          {selectedAlert ? (
            <DetailPanel alert={selectedAlert} onClose={() => setSelectedId(null)} />
          ) : (
            <div className="bg-surface-800 border border-surface-600 rounded h-24 lg:h-full flex items-center justify-center">
              <span className="text-xs text-slate-600 font-mono">Select an alert to inspect</span>
            </div>
          )}
        </div>

      </div>

      </> /* end monitor view */}

      {/* ── FOOTER ── */}
      <footer className="border-t border-surface-700 px-4 py-2 flex flex-col sm:flex-row sm:items-center justify-between gap-1 sm:gap-0 bg-surface-800 shrink-0">
        <div className="hidden sm:flex items-center gap-4 text-xs font-mono text-slate-600">
          <span>Rooster v2.4.1</span>
          <span>·</span>
          <span>Open Government Products</span>
          <span>·</span>
          <span>SingHealth Cluster — SGH, TTSH, CGH, NUH, KKH</span>
        </div>
        <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs font-mono">
          <span className="text-slate-600">System:</span>
          <span className="flex items-center gap-1.5 text-green-400">
            <span className="w-1.5 h-1.5 rounded-full bg-green-400" />
            Operational
          </span>
          <span className="text-slate-600">SMS:</span>
          <span className="flex items-center gap-1.5 text-green-400">
            <span className="w-1.5 h-1.5 rounded-full bg-green-400" />
            Online
          </span>
          <span className="text-slate-600">HIS:</span>
          <span className="flex items-center gap-1.5 text-green-400">
            <span className="w-1.5 h-1.5 rounded-full bg-green-400" />
            Synced
          </span>
        </div>
      </footer>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
